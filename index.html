<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MediaCrate is a Vue 3 SPA for cataloging personal physical music media (CDs, vinyl, etc.), with Supabase for auth/data/storage and Discogs integration for release metadata lookup.">
    <meta name="keywords" content="music collection catalog, CD catalog, vinyl catalog, record collection tracker, Discogs integration, physical media inventory, album collection manager, music library app">
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval';
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://*.supabase.co;
      img-src 'self' data: https:;
      font-src 'self' https://fonts.gstatic.com;
    ">
    <title>MediaCrate</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
